apiVersion: v1
kind: Service
metadata:
  name: janusgate-service
  namespace: default
  labels:
    app.kubernetes.io/name: janusgate
spec:
  type: ClusterIP
  selector:
    app: janusgate
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
