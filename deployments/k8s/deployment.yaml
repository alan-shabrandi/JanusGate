apiVersion: apps/v1
kind: Deployment
metadata:
  name: janusgate
  namespace: default
  labels:
    app.kubernetes.io/name: janusgate
    app.kubernetes.io/part-of: janusgate-infrastructure
spec:
  replicas: 3
  selector:
    matchLabels:
      app: janusgate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: janusgate
    spec:
      containers:
        - name: janusgate
          image: alanshabrandi/janusgate:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: janusgate-config
