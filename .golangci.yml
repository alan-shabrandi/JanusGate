run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govetted
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gosec
    - bodyclose
    - misspell

issues:
  exclude-use-default: false
  max-same-issues: 0
  max-issues-per-linter: 0
