name: JanusGate CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    name: Native Go Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Gateway
        run: go build -v -o janusgate ./cmd/gateway
