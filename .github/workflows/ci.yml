name: JanusGate CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Go Linter (golangci-lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.57.2
          args: --config=.golangci.yml --timeout=5m

  test:
    name: Run Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Execute Unit Tests with Race Detector & Coverage
        run: |
          go test -v -race -failfast -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Display Coverage Summary
        run: |
          go tool cover -func=coverage.txt

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    name: Docker Multi-Stage Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: janusgate:latest
          cache-from: type=gha
          cache-to: type=inline
