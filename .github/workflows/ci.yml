name: JanusGate CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Native Go Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Download Dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...
