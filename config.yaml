server:
  port: 8080
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

auth:
  jwt_secret: "janusgate-super-secret-key-change-in-production"
  token_expiry: 15m

routes:
  - path: "/api/v1/auth/"
    target: "http://localhost:8081"
    strip_prefix: "/api/v1/auth"
    requires_auth: false

  - path: "/api/v1/users/"
    target: "http://localhost:8082"
    strip_prefix: "/api/v1"
    requires_auth: true

  - path: "/api/v1/orders/"
    target: "http://localhost:8083"
    strip_prefix: "/api/v1"
    requires_auth: true
