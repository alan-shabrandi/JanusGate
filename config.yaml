server:
  port: 8080

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

auth:
  jwt_secret: "super-secret-key-janusgate-32bytes!!"

routes:
  - id: "user-service"
    path_prefix: "/api/v1/users"
    strip_prefix: true
    requires_auth: true
    timeout: 3s
    retry:
      attempts: 2
      initial_interval: 100ms
      max_interval: 1s
    upstreams:
      - url: "http://localhost:8081"
        weight: 3
      - url: "http://localhost:8082"
        weight: 1
      - url: "http://localhost:8083"
        weight: 1

  - id: "payment-service"
    path_prefix: "/api/v1/payments"
    strip_prefix: false
    requires_auth: true
    timeout: 5s
    upstreams:
      - url: "http://localhost:9090"
        weight: 1
