server:
  port: 8080
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

auth:
  jwt_secret: "janusgate-super-secret-key-change-in-production"
  token_expiry: 15m

routes:
  - id: "order-service"
    path_prefix: "/api/v1/orders"
    timeout: 5s
    retry:
      attempts: 3
      initial_interval: 100ms
      max_interval: 1s
    upstreams:
      - url: "http://localhost:8081"
